name: securo

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/securo
  SECRET_KEY: ${SECRET_KEY}
  DEBUG: "false"
  FRONTEND_URL: ${FRONTEND_URL:-http://46.225.24.167}
  PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID:-}
  PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET:-}
  PLUGGY_OAUTH_REDIRECT_URI: ${PLUGGY_OAUTH_REDIRECT_URI:-http://46.225.24.167/oauth/callback}
  REDIS_URL: redis://redis:6379/0
  OPENEXCHANGERATES_APP_ID: ${OPENEXCHANGERATES_APP_ID:-}
  BRAPI_API_KEY: ${BRAPI_API_KEY:-}
  FX_SYNC_MODE: ${FX_SYNC_MODE:-scheduled}
  STORAGE_LOCAL_PATH: /app/data/attachments

x-backend-base: &backend-base
  build: ./backend
  environment: *backend-env
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  volumes:
    - attachments:/app/data/attachments
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    # Drop-in replacement for postgres:16-alpine that bundles the
    # pgvector extension — required by agents knowledge-base migration
    # 046 even though we run with AGENTS_ENABLED=false (the migration
    # still has to land so the schema stays in sync with upstream).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: securo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    <<: *backend-base
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      # deploy.sh aponta para Dockerfile.prebuilt quando o dist/ enviado
      # confere com o commit atual; sem isso, compila no servidor.
      dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile}
    ports:
      - "80:8080"
    environment:
      # Consumido pelo default.conf.template via envsubst; e o alvo do
      # proxy /api/ dentro da rede do compose.
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  celery-worker:
    <<: *backend-base
    # --concurrency=2 caps the celery-worker pool size — without it
    # celery defaults to N_CPUs which spins up a full process per core
    # (each holding its own SQLAlchemy engine + asyncio loop). On the
    # 4-core Hetzner box that was ~600 MB of idle worker RAM. Upstream
    # commit 7186dfd added this for the same reason on docker-compose.yml.
    command: celery -A app.worker worker --loglevel=info --concurrency=2

  celery-beat:
    <<: *backend-base
    command: celery -A app.worker beat --loglevel=info

volumes:
  pgdata:
  attachments:
